name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tags: nodevice
          - os: windows-latest
            tags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: rutstream/go.sum

      - name: Сборка
        working-directory: rutstream
        run: go build -tags "${{ matrix.tags }}" ./...

      - name: Тесты
        working-directory: rutstream
        run: go test -tags "${{ matrix.tags }}" -count=1 ./...

      - name: Тесты с проверкой гонок
        working-directory: rutstream
        run: go test -tags "${{ matrix.tags }}" -race -count=1 ./...

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: rutstream/go.sum
      - name: go vet
        working-directory: rutstream
        run: go vet -tags nodevice ./...

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: rutstream/go.sum
      - name: Сборка одного exe (без консоли)
        working-directory: rutstream
        run: go build -ldflags "-s -w -H windowsgui -X main.version=ci" -o bin\rutstream.exe ./cmd/rutstream
      - name: Приложение запускается
        shell: pwsh
        working-directory: rutstream
        run: |
          $p = Start-Process -FilePath .\bin\rutstream.exe -ArgumentList '--help' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: rutstream-windows
          path: rutstream/bin/rutstream.exe
          if-no-files-found: error
